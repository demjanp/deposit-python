[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deposit"
description = "Python driver for Deposit - Graph database for scientific data collection"
readme = "README.md"
requires-python = ">=3.14, <3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Peter Demján", email = "peter.demjan@gmail.com"}
]
keywords = ["database", "graph"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Database",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows :: Windows 10"
]
dynamic = ["version"]
dependencies = ["neo4j>=6.1,<7", "networkx>=3.4,<4"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "build>=1.2,<2"]

[project.urls]
homepage = "https://github.com/demjanp/deposit-python"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
markers = ["integration: requires a server-owned live runtime"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["deposit*"]

[tool.setuptools.package-data]
deposit = ["_procedure_manifest.json"]

[tool.setuptools_scm]
version_file = "src/deposit/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
